name: Dependency Security Refresh

on:
  push:
    branches:
      - codex/payra-v1-completion-20260904

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jordan_payroll_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      APP_URL: http://payroll.test
      CENTRAL_DOMAIN: payroll.test
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: jordan_payroll_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TENANT_DB_PREFIX: ci_tenant_
      CACHE_STORE: redis
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/payra-v1-completion-20260904
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Prepare environment
        run: touch .env
      - name: Upgrade Laravel safely
        run: |
          composer config license proprietary
          composer require 'laravel/framework:^12.65' --with-all-dependencies --no-interaction --no-progress
      - name: Upgrade Vite toolchain safely
        run: npm install --save-dev 'vite@^8.2.1' 'laravel-vite-plugin@^3.1.3' --no-audit --no-fund
      - name: Validate PHP dependencies
        run: |
          composer validate --strict
          composer audit
      - name: Validate frontend dependencies
        run: npm audit --audit-level=high
      - name: Full application validation
        run: |
          php artisan migrate --force
          php artisan test --display-warnings
          npm run build
      - name: Commit refreshed lockfiles and remove this one-shot workflow
        run: |
          git config user.name 'payra-ci'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/dependency-refresh.yml
          git add composer.json composer.lock package.json package-lock.json
          git commit -m 'Upgrade Laravel and Vite security dependencies'
          git push origin HEAD:codex/payra-v1-completion-20260904
