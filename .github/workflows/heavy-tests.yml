name: Heavy Tests

on:
  push:
    branches:
      - codex/heavy-tests-20260904
  pull_request:
    branches:
      - main

jobs:
  backend:
    name: Backend PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: jordan_payroll_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: false
      APP_URL: http://payroll.test
      CENTRAL_DOMAIN: payroll.test
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: jordan_payroll_test
      DB_USERNAME: root
      DB_PASSWORD: root
      TENANT_DB_PREFIX: ci_tenant_
      CACHE_STORE: redis
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, bcmath, pdo_mysql
          coverage: none

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax scan
        run: find app bootstrap config database routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Laravel boot and route registration
        run: |
          php artisan about
          php artisan route:list

      - name: Config cache smoke test
        run: |
          php artisan config:cache
          php artisan config:clear

      - name: Code style check
        run: ./vendor/bin/pint --test

      - name: Fresh central database migration
        run: php artisan migrate:fresh --force

      - name: Full PHPUnit suite
        run: php artisan test

      - name: Migration rollback/forward smoke test
        run: |
          php artisan migrate:rollback --step=1 --force
          php artisan migrate --force

      - name: Laravel optimization smoke test
        run: |
          php artisan optimize
          php artisan about
          php artisan optimize:clear

      - name: Composer security audit
        run: composer audit

  frontend:
    name: Frontend build and audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Production build
        run: npm run build
      - name: Dependency security audit
        run: npm audit --audit-level=high
